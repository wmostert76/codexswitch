name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile Python entry points
        run: |
          python -m py_compile \
            bin/codexswitch \
            bin/codexswitch_backend.py \
            bin/codexswitch-tui \
            bin/codex-claude-proxy \
            bin/codex-openai-proxy \
            bin/codex-provider-proxy \
            bin/codex-opencode-go-proxy \
            bin/codex-azure-proxy \
            bin/codexswitch-azure-token \
            bin/codexswitch-claude-token \
            bin/opencode-go-token \
            bin/codexswitch_common.py

      - name: Validate shell scripts
        run: bash -n install.sh uninstall.sh

      - name: Run test suite
        run: python -m pytest tests/ -v

      - name: Headless TUI test (80x24 and 120x40)
        run: python -m pytest tests/test_tui_headless.py -v

  go-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -d cmd/codexswitch cmd/codexswitch-proxy internal/proxy)"

      - name: Test with race detector
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build production proxy
        run: go build ./cmd/codexswitch-proxy

  windows-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile Python entry points
        run: |
          python -m py_compile bin/codexswitch bin/codexswitch_backend.py bin/codexswitch-tui bin/codex-claude-proxy bin/codex-openai-proxy bin/codex-provider-proxy bin/codex-opencode-go-proxy bin/codex-azure-proxy bin/codexswitch-azure-token bin/codexswitch-claude-token bin/opencode-go-token bin/codexswitch_common.py

      - name: Run Windows test suite
        run: python -m pytest tests/ -v
